<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e6dc">
<meta name="description" content="Pocket OS — a filled sample A6 notebook: eight weeks of the system in use, page by page.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket OS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pocket OS · Sample Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Google+Sans+Code:wght@400..700&display=swap" rel="stylesheet">
<!-- Caveat has no rupee sign: pull just that glyph from Kalam -->
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&text=%E2%82%B9&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9e6dc;
    --ink: #2b2a27;
    --ink-soft: #5d5a53;
    --rule: #b9b4a7;
    --red: #a8584a;
    --mono: "Google Sans Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --pen: #24304d;               /* blue-black ballpoint */
    --sheet: #f5f0e3;             /* notebook paper */
    --dot: rgba(90, 82, 66, .42);
    --kraft: #b78a5d;
    --hand: "Caveat", "Kalam", "Segoe Print", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }
  body {
    margin: 0; color: var(--ink);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.35), transparent 65%),
      var(--paper);
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- site nav (same as the other two pages) ---------- */
  .site-nav {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px 16px;
    padding: 14px 16px 10px; max-width: 1040px; width: 100%; margin: 0 auto;
    font: 600 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase;
    border-bottom: 1px solid var(--rule);
  }
  .site-nav .brand { color: var(--ink); text-decoration: none; }
  .site-nav .brand b { color: var(--red); }
  .site-nav .links { display: flex; gap: 16px; flex-wrap: wrap; }
  .site-nav .links a { color: var(--ink-soft); text-decoration: none; padding-bottom: 3px; border-bottom: 1.5px solid transparent; }
  .site-nav .links a:hover { color: var(--ink); border-bottom-color: var(--rule); }
  .site-nav .links a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  @media (max-width: 480px) {
    .site-nav { padding: 10px 12px 8px; }
    .site-nav .brand { display: none; }
    .site-nav .links { gap: 12px; width: 100%; justify-content: space-between; }
  }

  /* ---------- stage ---------- */
  #stage {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    touch-action: pinch-zoom; user-select: none; -webkit-user-select: none;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #view {
    position: absolute; left: 50%; top: 50%;
    height: 592px; transform-origin: 50% 50%;
    opacity: 0; transition: opacity .4s;
  }
  body.ready #view { opacity: 1; }
  #view.single { overflow: hidden; overflow: clip; overflow-clip-margin: 24px; }
  #book { position: absolute; left: 0; top: 0; width: 840px; height: 592px; }

  /* page blocks under the leaves: shadow + visible page edges */
  .block { position: absolute; top: 0; width: 420px; height: 592px; --t: 4px; z-index: 0; }
  .block::before {                      /* drop shadow */
    content: ""; position: absolute; inset: 4px 0 -2px;
    box-shadow: 0 18px 34px -8px rgba(40,30,15,.35), 0 3px 8px rgba(40,30,15,.18);
  }
  .block::after {                       /* stacked page edges */
    content: ""; position: absolute; top: 2px; bottom: calc(-1 * var(--t));
    width: var(--t);
    background: repeating-linear-gradient(90deg, #efe8d6 0 1px, #d9d0bb 1px 2px);
    border-radius: 0 2px 3px 0;
  }
  #blockL { left: 0; }
  #blockL::after { left: calc(-1 * var(--t)); transform: scaleX(-1); }
  #blockR { left: 420px; }
  #blockR::after { right: calc(-1 * var(--t)); }

  /* every page face is a flat layer in book coordinates (no 3D anywhere) */
  .face {
    position: absolute; left: 0; top: 0; width: 420px; height: 592px;
    overflow: hidden; transform-origin: 0 0; display: none;
  }
  /* a turn: the flap (reverse of the sheet) sits in a wrapper that throws a
     soft shadow on whatever it lies over */
  #flapWrap {
    position: absolute; left: 0; top: 0; width: 840px; height: 592px;
    z-index: 5; pointer-events: none; display: none;
    filter: drop-shadow(0 0 7px rgba(35,22,5,.32)) drop-shadow(-1px 2px 2px rgba(35,22,5,.18));
  }
  #flapWrap.hard { filter: drop-shadow(0 2px 9px rgba(35,22,5,.42)); }
  #flapWrap .face { z-index: 1; }
  .fx { position: absolute; left: 0; top: 0; width: 840px; height: 592px; pointer-events: none; }
  #flapWrap .fx { z-index: 2; }
  .fx.under { z-index: 4; display: none; }
  @media (prefers-reduced-motion: reduce) { #flapWrap { filter: none; } }

  /* ---------- paper ---------- */
  .paper {
    background-color: var(--sheet);
    background-image:
      radial-gradient(circle at 10px 10px, var(--dot) 0 1.05px, transparent 1.6px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 20px 20px, 220px 220px;
    background-position: 0 6px, 0 0;
  }
  /* gutter: the page curves into the binding */
  .paper::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 46px; pointer-events: none; z-index: 2;
  }
  .paper.rp::before { left: 0;  background: linear-gradient(90deg, rgba(60,45,20,.22), rgba(60,45,20,.07) 35%, transparent); }
  .paper.lp::before { right: 0; background: linear-gradient(270deg, rgba(60,45,20,.22), rgba(60,45,20,.07) 35%, transparent); }
  .paper.rp { border-radius: 0 3px 3px 0; }
  .paper.lp { border-radius: 3px 0 0 3px; }

  /* the sewing thread at the centre of each signature */
  .thread { position: absolute; top: 0; bottom: 0; width: 3px; z-index: 3; }
  .rp .thread { left: 0; }
  .lp .thread { right: 0; }
  .thread::before {
    content: ""; position: absolute; left: 0; right: 0; top: 34px; bottom: 34px;
    background: repeating-linear-gradient(180deg,
      #ece4d0 0 104px, #8f7f63 104px 106px, transparent 106px 120px, #8f7f63 120px 122px);
    box-shadow: 0 0 0 .5px rgba(80,65,40,.35);
    border-radius: 2px;
  }

  /* ---------- handwriting ---------- */
  .content {
    position: absolute; left: 30px; top: 20px; width: 360px;
    font: 500 21.5px/20px var(--hand); color: var(--pen);
    z-index: 1;
  }
  .ln { position: relative; height: 20px; white-space: nowrap; display: flex; align-items: flex-end; transform-origin: 0 80%; }
  .ln .l { flex: 0 1 auto; }
  .ln .r { margin-left: auto; padding-left: 10px; flex: none; }
  .ln.h { font-weight: 700; font-size: 25px; letter-spacing: .01em; }
  .ln.h .l {
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 6' preserveAspectRatio='none'><path d='M1 3.6C40 2.2 80 4.4 120 3 160 2 185 3.8 199 2.8' fill='none' stroke='%2324304d' stroke-width='1.6' stroke-linecap='round'/></svg>") 0 100% / 100% 5px no-repeat;
    padding-bottom: 1px;
  }
  .ln.dt { font-weight: 700; font-size: 23px; }
  .ln.dt .l { border-bottom: 1.4px solid currentColor; border-radius: 0 0 40% 10%; padding-right: 6px; }
  .ln.rule::after { content: ""; position: absolute; left: 0; right: 10px; top: 13px; border-top: 1.4px solid var(--pen); border-radius: 50%; opacity: .7; }
  .ln b { font-weight: 700; }
  .ln u { text-decoration: none; border-bottom: 1.3px solid currentColor; }
  .ln s { text-decoration: none; position: relative; }
  .ln s::after {
    content: ""; position: absolute; left: -2px; right: -2px; top: 52%;
    border-top: 1.6px solid var(--pen); transform: rotate(-1.2deg);
  }
  .pt {                                   /* point letter in the margin */
    position: absolute; left: -26px; bottom: 1px;
    width: 17px; height: 17px; border: 1.3px solid currentColor; border-radius: 50%;
    font: 700 15px/14px var(--hand); text-align: center; font-style: normal;
  }
  .grid { display: flex; align-self: stretch; margin-left: -10px; margin-right: 6px; flex: none; }
  .grid .c { width: 20px; height: 20px; text-align: center; position: relative; }
  .grid .c.d { font-weight: 700; font-size: 18px; }
  .grid .b { position: absolute; left: 6.5px; top: 12.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--pen); }
  .grid .m { position: absolute; left: 4px; top: 10px; width: 12px; height: 12px; fill: none; stroke: var(--pen); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ln.gl .l { padding-left: 2px; }
  .g { display: inline-block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; overflow: visible; }
  .g.ar { width: 17px; height: 11px; margin: 0 1px; }
  .g.ar2 { width: 22px; height: 11px; margin: 0 1px; }
  .g.ci { width: 12px; height: 12px; margin-right: 1px; vertical-align: 0; }
  .sk { position: relative; }
  .sk svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .sk svg .i { fill: none; stroke: var(--pen); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
  .sk svg .f { fill: var(--pen); }
  .sk svg text { font: 500 19px var(--hand); fill: var(--pen); }
  .sk svg text.s { font-size: 16px; }
  .pn {                                   /* handwritten page number, outer corner */
    position: absolute; bottom: 12px; font: 600 17px/1 var(--hand); color: var(--pen); opacity: .8; z-index: 1;
  }
  .rp .pn { right: 22px; }
  .lp .pn { left: 22px; }

  /* ---------- kraft covers ---------- */
  .kraft {
    background-color: var(--kraft);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='k'><feTurbulence type='fractalNoise' baseFrequency='.9 .35' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .16  0 0 0 0 .07  0 0 0 .32 0'/></filter><rect width='100%' height='100%' filter='url(%23k)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.02' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>");
    box-shadow: inset 0 0 0 1px rgba(80,55,25,.35);
  }
  .kraft.front, .kraft.ibc { border-radius: 0 4px 4px 0; }
  .kraft.back, .kraft.ifc { border-radius: 4px 0 0 4px; }
  .kraft.ifc, .kraft.ibc { background-color: #c39a6d; }
  .kraft.ifc::before, .kraft.ibc::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40px; pointer-events: none;
  }
  .kraft.ifc::before { right: 0; background: linear-gradient(270deg, rgba(60,35,10,.28), transparent); }
  .kraft.ibc::before { left: 0; background: linear-gradient(90deg, rgba(60,35,10,.28), transparent); }
  .kraft .content { color: #1d2640; }
  .spine {                                /* fold + exposed stitches along the spine */
    position: absolute; top: 0; bottom: 0; width: 22px;
    background: linear-gradient(90deg, rgba(60,35,10,.30), rgba(60,35,10,.05) 70%, rgba(255,240,210,.12));
  }
  .front .spine { left: 0; }
  .back .spine { right: 0; transform: scaleX(-1); }
  .spine::after {
    content: ""; position: absolute; left: 7px; width: 2.6px; top: 40px; bottom: 40px;
    background: repeating-linear-gradient(180deg, #efe6d2 0 110px, transparent 110px 118px);
    border-radius: 2px; box-shadow: 0 0 0 .6px rgba(70,45,20,.5), 1px 1px 1px rgba(40,25,5,.25);
  }
  .label {
    position: absolute; left: 92px; top: 132px; width: 250px; height: 150px;
    background: #f3ecdc; border-radius: 6px;
    box-shadow: 0 1px 2px rgba(50,30,10,.35), inset 0 0 0 1px rgba(120,95,60,.25);
    transform: rotate(-1.2deg);
    font-family: var(--hand); color: var(--pen); text-align: center;
  }
  .label .t { position: absolute; left: 0; right: 0; top: 18px; font: 700 40px/1 var(--hand); letter-spacing: .02em; }
  .label .v { position: absolute; left: 0; right: 0; top: 70px; font: 600 30px/1 var(--hand); }
  .label .d { position: absolute; left: 0; right: 0; top: 108px; font: 500 21px/1 var(--hand); }
  .label::before { content: ""; position: absolute; left: 14px; right: 14px; top: 64px; border-top: 1px solid rgba(120,95,60,.4); }
  .stamp {
    position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
    font: 600 10px/1.7 var(--mono); letter-spacing: .18em; text-transform: uppercase;
    color: rgba(60,35,12,.62);
  }
  .mark { position: absolute; left: 50%; top: 380px; width: 46px; height: 46px; margin-left: -23px; opacity: .55; }

  /* ---------- controls ---------- */
  .bar {
    display: flex; align-items: center; gap: 10px;
    max-width: 840px; width: 100%; margin: 0 auto; padding: 8px 12px 12px;
  }
  .bar button {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
    font: 600 20px/1 var(--mono); cursor: pointer;
  }
  .bar button:disabled { opacity: .3; cursor: default; }
  .bar button { transition: background .15s, transform .12s; }
  .bar button:not(:disabled):hover { background: rgba(0,0,0,.05); }
  .bar button:not(:disabled):active { transform: scale(.92); background: rgba(0,0,0,.08); }
  .mid #where, .mid #about { transition: opacity .15s ease; }
  .mid.swap #where, .mid.swap #about { opacity: 0; }
  .mid { flex: 1; min-width: 0; text-align: center; }
  #where { font: 600 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  #about { display: block; font: 400 12.5px/1.35 var(--mono); color: var(--ink-soft); margin-top: 3px;
           overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.7em; }
  .jumpwrap { display: block; margin-top: 6px; }
  #jump {
    font: 500 12px var(--mono); color: var(--ink); background: transparent;
    border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; max-width: 100%;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  noscript p { text-align: center; font: 14px var(--mono); padding: 20px; }
  @media print { .bar, .site-nav { display: none; } }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Pocket OS">
  <a class="brand" href="index.html">Pocket <b>OS</b></a>
  <div class="links">
    <a href="index.html">Notebook setup</a>
    <a href="30-day.html">First 30 days</a>
    <a href="notebook.html" aria-current="page">Sample notebook</a>
  </div>
</nav>

<main id="stage" aria-label="Sample Pocket OS notebook. Use the arrow keys, swipe, or tap either side to turn pages.">
  <div id="view">
    <div id="book">
      <div class="block" id="blockL"></div>
      <div class="block" id="blockR"></div>
    </div>
  </div>
  <noscript><p>The sample notebook needs JavaScript to turn its pages.</p></noscript>
</main>

<div class="bar">
  <button id="prev" type="button" aria-label="Previous page">‹</button>
  <div class="mid" aria-live="polite">
    <span id="where">Cover</span>
    <span id="about"></span>
    <label class="jumpwrap"><span class="sr">Jump to a feature</span>
      <select id="jump"><option value="">Jump to a feature…</option></select>
    </label>
  </div>
  <button id="next" type="button" aria-label="Next page">›</button>
</div>

<!-- shared hand-drawn wobble for sketches -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="2.6"/>
  </filter>
</svg>

<script src="notebook-pages.js"></script>
<script src="notebook.js"></script>
</body>
</html>
